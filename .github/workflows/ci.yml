name: CI
# Known gap, accepted: Windows is in the release matrix but not CI.
on: [push, pull_request]
env:
  TURBOVEC_EX_BUILD: "1"
jobs:
  test:
    name: test (${{ matrix.os }} / Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        elixir: ["1.17", "1.18", "1.19", "1.20"]
        otp: ["26", "27", "28"]
        exclude:
          # 1.17 and 1.18 support OTP 25–27
          - { elixir: "1.17", otp: "28" }
          - { elixir: "1.18", otp: "28" }
          # 1.20 requires OTP 27+
          - { elixir: "1.20", otp: "26" }
        include:
          - { os: macos-latest, elixir: "1.20", otp: "28" }
          # 1.20 supports OTP 27–29; setup-beam macOS builds are thinner,
          # so 29 stays Ubuntu-only.
          - { os: ubuntu-latest, elixir: "1.20", otp: "29" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1 # has macOS builds; do not brew-install
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      # @stable + toolchain input is the action's guaranteed spelling;
      # a bare @1.89 ref may not exist as a tag. Same pin as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.89" }
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
        if: matrix.os == 'ubuntu-latest' && matrix.elixir == '1.20' && matrix.otp == '28'
      - run: mix test
      - run: cargo test --manifest-path native/turbovec_nif/Cargo.toml
        if: matrix.os == 'ubuntu-latest' && matrix.elixir == '1.20' && matrix.otp == '28'
  no-nx:
    runs-on: ubuntu-latest
    env:
      NO_NX: "1"
      TURBOVEC_EX_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28", elixir-version: "1.20" }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.89" }
      - run: mix deps.get
      # The spec's Nx tripwire: must COMPILE (not merely skip) without Nx
      - run: mix compile --warnings-as-errors --force
      - run: mix test --exclude nx
  credo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28", elixir-version: "1.20" }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.89" }
      - run: mix deps.get
      - run: mix credo --strict
  deps_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28", elixir-version: "1.20" }
      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix hex.audit
      - run: mix deps.audit
